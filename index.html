<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Kenny's Garage</title>
  <style>
    :root {
      --bg: #0d0d0f; --panel: #1a1a1e; --panel2: #242428; --accent: #ff6b00; --accent2: #ff9500;
      --chrome: #c0c0c8; --text: #f0f0f5; --muted: #888899; --success: #22c55e; --danger: #ef4444;
      --info: #3b82f6; --border: #333338;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; line-height: 1.4; }
    .header { background: linear-gradient(180deg, #1a1a1e 0%, #0d0d0f 100%); border-bottom: 2px solid var(--accent); padding: 10px 12px; position: sticky; top: 0; z-index: 100; display: flex; align-items: center; gap: 10px; }
    .logo { width: 52px; height: 52px; border-radius: 10px; object-fit: cover; border: 2px solid var(--accent); flex-shrink: 0; }
    .header-info { flex: 1; min-width: 0; }
    .game-title { font-size: 1.15rem; font-weight: 800; background: linear-gradient(90deg, var(--chrome), var(--accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .stats-row { display: flex; gap: 12px; font-size: 0.8rem; color: var(--muted); margin-top: 2px; flex-wrap: wrap; }
    .stat strong { color: var(--accent2); }
    .nav { display: flex; background: var(--panel); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; position: sticky; top: 72px; z-index: 90; }
    .nav::-webkit-scrollbar { display: none; }
    .nav-btn { flex: 0 0 auto; min-width: 64px; padding: 10px 8px; background: none; border: none; color: var(--muted); font-size: 0.65rem; font-weight: 600; text-align: center; cursor: pointer; border-bottom: 3px solid transparent; }
    .nav-btn.active { color: var(--accent); border-bottom-color: var(--accent); background: rgba(255,107,0,0.08); }
    .nav-btn span { display: block; font-size: 1.25rem; margin-bottom: 2px; }
    .content { padding: 12px; padding-bottom: 80px; max-width: 640px; margin: 0 auto; }
    .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
    .panel-title { font-size: 0.95rem; font-weight: 700; color: var(--accent2); margin-bottom: 10px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 14px; border: none; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; background: var(--accent); color: #000; }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    .btn-secondary { background: var(--panel2); color: var(--text); border: 1px solid var(--border); }
    .btn-danger { background: var(--danger); color: #fff; }
    .btn-sm { padding: 6px 10px; font-size: 0.75rem; }
    .btn-block { width: 100%; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .card { background: var(--panel2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; margin-bottom: 8px; }
    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 6px; }
    .card-title { font-weight: 700; font-size: 0.9rem; }
    .badge { display: inline-block; padding: 2px 7px; border-radius: 20px; font-size: 0.65rem; font-weight: 700; background: var(--accent); color: #000; }
    .badge-muted { background: var(--panel); color: var(--muted); border: 1px solid var(--border); }
    .badge-success { background: var(--success); }
    .meta { font-size: 0.75rem; color: var(--muted); margin-top: 4px; }
    .progress-bar { height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; margin-top: 6px; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); }
    .kenny-box { display: flex; gap: 12px; align-items: center; }
    .kenny-img { width: 90px; height: 110px; object-fit: cover; border-radius: 10px; border: 2px solid var(--accent); }
    .skill-row { display: flex; justify-content: space-between; margin-bottom: 3px; }
    .cars-banner { width: 100%; border-radius: 10px; margin: 8px 0; border: 1px solid var(--border); }
    .log { max-height: 140px; overflow-y: auto; font-size: 0.75rem; background: #111; border-radius: 8px; padding: 8px; border: 1px solid var(--border); }
    .log-entry { margin-bottom: 4px; color: var(--muted); }
    .log-entry.good { color: var(--success); }
    .log-entry.bad { color: var(--danger); }
    .log-entry.event { color: var(--accent2); }
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .modal { background: var(--panel); border-radius: 16px 16px 0 0; width: 100%; max-width: 500px; max-height: 85vh; overflow-y: auto; padding: 18px; border-top: 3px solid var(--accent); }
    .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .modal-title { font-size: 1.1rem; font-weight: 700; }
    .close-btn { background: none; border: none; color: var(--muted); font-size: 1.5rem; cursor: pointer; }
    .sub-tabs { display: flex; gap: 4px; margin-bottom: 12px; overflow-x: auto; }
    .sub-tab { padding: 6px 12px; border-radius: 20px; border: 1px solid var(--border); background: var(--panel2); color: var(--muted); font-size: 0.75rem; font-weight: 600; cursor: pointer; white-space: nowrap; }
    .sub-tab.active { background: var(--accent); color: #000; border-color: var(--accent); }
    .empty { text-align: center; padding: 24px; color: var(--muted); }
    .race-result { text-align: center; padding: 16px; }
    .race-result.win h2 { color: var(--success); }
    .race-result.lose h2 { color: var(--danger); }
    .toast { position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%) translateY(100px); background: var(--panel2); color: var(--text); padding: 10px 18px; border-radius: 30px; border: 1px solid var(--accent); z-index: 300; opacity: 0; transition: all 0.3s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  </style>
</head>
<body>
  <div class="header">
    <img src="logo.jpg" alt="Kenny's Garage" class="logo" onerror="this.style.display='none'">
    <div class="header-info">
      <div class="game-title">Kenny's Garage</div>
      <div class="stats-row">
        <div class="stat">$<strong id="money">50</strong></div>
        <div class="stat">Day <strong id="day">1</strong></div>
        <div class="stat"><span id="clock">08:00</span></div>
        <div class="stat">XP <strong id="xp">0</strong></div>
        <div class="stat">Rep <strong id="rep">0</strong></div>
      </div>
      <div style="margin-top:4px;height:4px;background:#222;border-radius:2px;overflow:hidden;">
        <div id="dayBar" style="height:100%;width:0%;background:linear-gradient(90deg,#ff6b00,#ff9500);"></div>
      </div>
    </div>
  </div>
  <nav class="nav" id="mainNav">
    <button class="nav-btn active" data-tab="home"><span>🏠</span>Home</button>
    <button class="nav-btn" data-tab="garage"><span>🔧</span>Garage</button>
    <button class="nav-btn" data-tab="work"><span>💼</span>Work</button>
    <button class="nav-btn" data-tab="school"><span>📚</span>School</button>
    <button class="nav-btn" data-tab="shop"><span>🛒</span>Shop</button>
    <button class="nav-btn" data-tab="cars"><span>🚗</span>Cars</button>
    <button class="nav-btn" data-tab="race"><span>🏁</span>Race</button>
  </nav>
  <div class="content" id="content"></div>
  <div class="modal-overlay" id="modalOverlay"><div class="modal" id="modal"></div></div>
  <div class="toast" id="toast"></div>
  <script src="data.js"></script>
  <script src="game.js"></script>
</body>
</html>
